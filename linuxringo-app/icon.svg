<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#1e1e2e"/>

  <!-- Penguin body -->
  <ellipse cx="256" cy="310" rx="110" ry="140" fill="#181825"/>
  <!-- Penguin belly -->
  <ellipse cx="256" cy="320" rx="72" ry="115" fill="#ffffff"/>

  <!-- Penguin head -->
  <circle cx="256" cy="170" r="100" fill="#181825"/>
  <!-- Face patch -->
  <ellipse cx="256" cy="175" rx="62" ry="58" fill="#ffffff"/>

  <!-- Eyes -->
  <circle cx="225" cy="158" r="14" fill="#181825"/>
  <circle cx="287" cy="158" r="14" fill="#181825"/>
  <!-- Eye shine -->
  <circle cx="229" cy="153" r="5" fill="#ffffff"/>
  <circle cx="291" cy="153" r="5" fill="#ffffff"/>

  <!-- Beak -->
  <ellipse cx="256" cy="208" rx="24" ry="18" fill="#f9e2af"/>

  <!-- Wings -->
  <ellipse cx="138" cy="300" rx="38" ry="80" fill="#181825" transform="rotate(-15 138 300)"/>
  <ellipse cx="374" cy="300" rx="38" ry="80" fill="#181825" transform="rotate(15 374 300)"/>

  <!-- Feet -->
  <ellipse cx="218" cy="450" rx="34" ry="18" fill="#f9e2af"/>
  <ellipse cx="294" cy="450" rx="34" ry="18" fill="#f9e2af"/>

  <!-- Terminal badge (bottom-right) -->
  <rect x="330" y="350" width="160" height="140" rx="28" fill="#89dceb"/>
  <!-- ">_" text -->
  <text x="348" y="450" font-family="monospace" font-weight="bold" font-size="72" fill="#1e1e2e">&gt;_</text>
</svg>
